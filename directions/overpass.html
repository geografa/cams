<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A simple map</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.0/mapbox-gl-geocoder.min.js"></script>
    <link
      rel="stylesheet"
      href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.0/mapbox-gl-geocoder.css"
      type="text/css"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      mapboxgl.accessToken =
        "pk.eyJ1IjoiZ3JhZmEiLCJhIjoiY2pxbjFhMTg1MDJ2MzQ0bXJpZ2c5NjM3eCJ9.XDmc8knZy11F1omDy_P22w";

      var map = new mapboxgl.Map({
        container: "map", // container id
        style: "mapbox://styles/mapbox/dark-v11", // YOUR TURN: choose a style: https://docs.mapbox.com/api/maps/#styles
        center: [-122.67836999999997, 45.51519800000003],
        zoom: 12,
        bearing: 0,
        pitch: 0,
      });

      // add a geocoder to the map
      var geocoder = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        mapboxgl: mapboxgl,
      });
      map.addControl(geocoder);

      // // when the geocoder returns a result, use the overpass turbo API https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3B%0A%2F%2F%20gather%20results%0Anwr%5B%22amenity%22%3D%22stripclub%22%5D%2845.43484008247013%2C-122.8374481201172%2C45.612116176517304%2C-122.45464324951172%29%3B%0A%2F%2F%20print%20results%0Aout%20geom%3B to return the data where type=way and display it on the map
      geocoder.on("result", function (ev) {
        var bbox = ev.result;
        console.log(bbox);
        var url =
          "https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3B%0A%2F%2F%20gather%20results%0Anwr%5B%22amenity%22%3D%22stripclub%22%5D" +
          "(" +
          bbox[1] +
          "," +
          bbox[0] +
          "," +
          bbox[3] +
          "," +
          bbox[2] +
          ")%3B%0A%2F%2F%20print%20results%0Aout%20geom%3B";
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            // console.log(data);
            map.addSource("overpass", {
              type: "geojson",
              data: data,
            });
            map.addLayer({
              id: "overpass",
              type: "line",
              source: "overpass",
              layout: {},
              paint: {
                "line-color": "red",
                "line-width": 2,
              },
            });
          });
      });
    </script>
  </body>
</html>
