name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Prefer a repo Secret; fall back to a repo Variable. Do not put this on the
      # github-pages Environment — that env is only attached to the deploy job.
      - name: Check Mapbox token
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || vars.VITE_MAPBOX_TOKEN }}
        run: |
          if [ -z "$VITE_MAPBOX_TOKEN" ]; then
            echo "::error::VITE_MAPBOX_TOKEN is empty. Add it under Settings → Secrets and variables → Actions as a Secret or Variable named VITE_MAPBOX_TOKEN (not under Environments → github-pages)."
            exit 1
          fi
          echo "VITE_MAPBOX_TOKEN is set (length ${#VITE_MAPBOX_TOKEN})"

      - name: Check TripCheck API key
        env:
          TRIPCHECK_API_KEY: ${{ secrets.TRIPCHECK_API_KEY }}
        run: |
          if [ -z "$TRIPCHECK_API_KEY" ]; then
            echo "::error::TRIPCHECK_API_KEY is empty. Add it under Settings → Secrets and variables → Actions as a Secret named TRIPCHECK_API_KEY (repository secret, not an Environment secret)."
            exit 1
          fi
          echo "TRIPCHECK_API_KEY is set (length ${#TRIPCHECK_API_KEY})"

      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || vars.VITE_MAPBOX_TOKEN }}
          TRIPCHECK_API_KEY: ${{ secrets.TRIPCHECK_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
