<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add a new clip layer to remove 3D content from the map.</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      mapboxgl.accessToken =
        "pk.eyJ1IjoiZ3JhZmEiLCJhIjoiY2ptYjNtZWxnMDBrdDNwbnVicGJzOWg2NyJ9.9OulyCe3kEqMAXPbx1mKUA";
      const map = (window.map = new mapboxgl.Map({
        container: "map",
        center: [-122.67181656527539, 45.55152512537785],
        zoom: 15.27,
        pitch: 42,
        bearing: -50,
        style: "mapbox://styles/mapbox/standard",
        minZoom: 15,
        // maxZoom: 16,
        hash: true,
      }));

      map.on("style.load", () => {
        // set the light preset to be in dusk mode.
        map.setConfigProperty("basemap", "lightPreset", "dusk");

        map.addSource("eraser", {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features: [
              {
                type: "Feature",
                properties: {},
                geometry: {
                  coordinates: [
                    [
                      [-122.6722643926743, 45.55095462398657],
                      [-122.67135861369306, 45.55094503052939],
                      [-122.67130123264268, 45.55135446370201],
                      [-122.67137689113073, 45.55201061989146],
                      [-122.67226539404164, 45.55205626566638],
                      [-122.6722643926743, 45.55095462398657],
                    ],
                  ],
                  type: "Polygon",
                },
              },
            ],
          },
        });

        map.addSource("model", {
          type: "geojson",
          data: {
            type: "Feature",
            properties: {
              "model-uri":
                "https://docs.mapbox.com/mapbox-gl-js/assets/tower.glb",
            },
            geometry: {
              coordinates: [-122.671951839668, 45.55145897762216],
              type: "Point",
            },
          },
        });

        map.addLayer({
          id: "eraser",
          type: "clip",
          source: "eraser",
          layout: {
            "clip-layer-types": ["symbol", "model"],
          },
        });

        map.addLayer({
          id: "tower",
          type: "model",
          source: "model",
          minzoom: 15,
          layout: {
            "model-id": ["get", "model-uri"],
          },
          paint: {
            "model-opacity": 1,
            "model-rotation": [0.0, 0.0, 35.0],
            "model-scale": [0.8, 0.8, 1.2],
            "model-color-mix-intensity": 0,
            "model-cast-shadows": true,
            "model-emissive-strength": 0.8,
          },
        });
      });
    </script>
  </body>
</html>
